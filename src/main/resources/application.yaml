spring:
  application:
    name: spring-with-openapi
  datasource:
    url: jdbc:postgresql://localhost:5433/courses_app
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    user:
      name: admin
      password: secret
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
server:
  port: 8080
  tomcat:
    threads:
      max: 200
      min: 10
management:
  endpoints:
    web:
      base-path: /admin/actuator
      exposure:
        include: '*'
        exclude: shutdown
info:
  app:
    name: MyApp
    version: 1.0.0

resilience4j.ratelimiter:
  instances:
    apiRateLimiter:
      limit-for-period: 5
      limit-refresh-period: 10s
      timeout-duration: 0
resilience4j.circuitbreaker:
  instances:
    apiCircuitBreaker:
      failure-rate-threshold: 50
      wait-duration-in-open-state: 10s
      permitted-number-of-calls-in-half-open-state: 3
      sliding-window-type: count_based
      sliding-window-size: 10